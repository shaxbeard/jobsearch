# Render Blueprint for jobtrends-web.
#
# Deploys a single always-on web service (no cold start) with a persistent
# disk for job_trends.db and data/, and runs the daily Google-trends update
# in-process on a background thread (see src/jobtrends/web/scheduler.py) since
# a separate Render "Cron Job" resource would not have access to this
# service's disk. See README.md's "Deploying to Render" section for details,
# including migrating your existing local job_trends.db to the disk.
#
# Before deploying, confirm the cheapest always-on plan name/price in the
# Render dashboard (Pricing > Web Services) and update `plan:` below if it has
# changed.

services:
  - type: web
    name: jobtrends-web
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT jobtrends.web.app:app
    healthCheckPath: /
    disk:
      name: jobtrends-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SERPER_API_KEY
        sync: false
      - key: JOB_TRENDS_DB
        value: /var/data/job_trends.db
      - key: JOBTRENDS_DATA_DIR
        value: /var/data/data
      - key: JOBTRENDS_ENABLE_SCHEDULER
        value: "1"
      - key: JOBTRENDS_UPDATE_HOUR_UTC
        value: "11"
